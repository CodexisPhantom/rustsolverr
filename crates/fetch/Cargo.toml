[package]
name = "rustsolverr-fetch"
version.workspace = true
edition.workspace = true

[features]
default = ["wreq"]
# The real HTTP client. It builds BoringSSL (needs cmake, perl, clang), so the
# crates that only need the `Fetcher` trait turn it off.
wreq = ["dep:wreq", "dep:wreq-util", "dep:url"]

[dependencies]
rustsolverr-common.workspace = true
async-trait.workspace = true
url = { workspace = true, optional = true }
wreq = { version = "0.16.3", optional = true, features = ["cookies", "socks", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "0.2.1", optional = true }
