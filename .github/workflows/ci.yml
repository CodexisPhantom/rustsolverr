name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # BoringSSL (wreq) needs cmake, perl and libclang.
      - run: sudo apt-get update && sudo apt-get install -y cmake perl pkg-config libclang-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rustsolverr:ci
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test with the real browser
        run: |
          docker run -d --name rustsolverr --shm-size 1g rustsolverr:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' rustsolverr)" = healthy ] && break
            sleep 2
          done
          docker exec rustsolverr python3 /usr/local/share/rustsolverr/smoke.py
      - name: Stops cleanly on SIGTERM
        run: |
          docker stop rustsolverr
          docker logs rustsolverr 2>&1 | tail -20
          test "$(docker inspect -f '{{.State.ExitCode}}' rustsolverr)" = 0
