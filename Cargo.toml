[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
rustsolverr-common = { path = "crates/common" }
rustsolverr-config = { path = "crates/config" }
rustsolverr-challenge = { path = "crates/challenge" }
rustsolverr-cache = { path = "crates/cache" }
rustsolverr-fetch = { path = "crates/fetch", default-features = false }
rustsolverr-browser = { path = "crates/browser" }
rustsolverr-solver = { path = "crates/solver" }
rustsolverr-api = { path = "crates/api" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
lto = "thin"
strip = true
